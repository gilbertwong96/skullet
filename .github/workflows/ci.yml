name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  elixir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      # _build carries the Dialyzer PLT, which is the slow part of `mix ci`.
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-1.18-27-${{ hashFiles('mix.lock') }}

      - run: mix deps.get
      # VibeKit's pipeline: compile, format, coveralls.lcov (the suite, 95% floor,
      # and cover/lcov.info), credo --strict, dialyzer, ex_dna --max-clones 0,
      # reach.check --arch --smells
      - run: mix ci
      - run: mix hex.build

      # excoveralls writes absolute `SF:` paths; Codecov matches repo-relative ones.
      - run: sed -i "s|$PWD/||" cover/lcov.info

      - uses: codecov/codecov-action@v5
        with:
          files: cover/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assets
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: assets/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: assets/pnpm-lock.yaml

      # esbuild's postinstall is a build script pnpm declines to run by default; on a cold
      # store that is an error (ERR_PNPM_IGNORED_BUILDS), so approve it explicitly.
      - run: pnpm install --frozen-lockfile --allow-build=esbuild
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm run verify
