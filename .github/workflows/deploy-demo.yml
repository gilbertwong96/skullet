name: Deploy demo

# The image has to be built for amd64 because Fly machines are amd64. Locally that means
# Rosetta (or an amd64 host); here GitHub's runners are amd64 already, and the build is the
# same `example/Dockerfile` the README documents.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "example/**"
      - "lib/**"
      - "priv/**"
      - ".github/workflows/deploy-demo.yml"

concurrency:
  group: deploy-demo
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --ha=false --config example/fly.toml --dockerfile example/Dockerfile
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
