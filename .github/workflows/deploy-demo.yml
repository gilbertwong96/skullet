name: Deploy demo

# The image has to be built for amd64 because Fly machines are amd64. Locally that means
# Rosetta (or an amd64 host); here GitHub's runners are amd64 already, and the build is the
# same `example/Dockerfile` the README documents.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "example/**"
      - "lib/**"
      - "priv/**"
      - ".github/workflows/deploy-demo.yml"

concurrency:
  group: deploy-demo
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # fly.io/install.sh, not the setup-flyctl action: that one resolves the latest
      # flyctl through the GitHub API, which 504s often enough to fail the job.
      - name: Install flyctl
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsSL https://fly.io/install.sh | sh; then exit 0; fi
            echo "flyctl download failed, retrying"
            sleep $((attempt * 15))
          done
          exit 1

      # --local-only builds with the runner's own amd64 Docker: Fly's remote builders
      # cannot reach GitHub for the Tailwind binary, and local amd64 builds on Apple
      # Silicon need Rosetta to run the Erlang VM.
      # The build downloads Hex packages and the Tailwind binary, so a transient
      # outage on either side fails it; retrying is cheaper than a red deploy.
      - name: Deploy
        run: |
          for attempt in 1 2 3; do
            $HOME/.fly/bin/flyctl deploy --ha=false --local-only \
              --config example/fly.toml --dockerfile example/Dockerfile && exit 0
            echo "deploy failed, retrying"
            sleep $((attempt * 20))
          done
          exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
