<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/skullet.css" />
  </head>
  <body>
    <div id="root" class="skullet" data-skullet-state="loading">
      <div data-skullet-overlay aria-hidden="true"></div>
      <div class="skullet-content" data-skullet-content>
        <h2>A heading that is coming</h2>
        <p>A paragraph long enough to wrap into more than one measured line of bars here.</p>
      </div>
    </div>

    <!-- no inline call: the file starts itself when it is loaded this way -->
    <script src="/skullet.pre.js"></script>
  </body>
</html>
