<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/skullet.css" />
    <style>
      .skullet {
        font: 16px/24px system-ui, sans-serif;
      }
      #a,
      #b,
      #fast,
      #pulse,
      #none {
        width: 640px;
      }
      #wide {
        width: 1280px;
      }
    </style>
  </head>
  <body>
    <div id="a" class="skullet" phx-hook="Skullet" data-skullet-state="loading">
      <span class="skullet-status">Loading</span>
      <div data-skullet-overlay aria-hidden="true"></div>
      <div class="skullet-content" data-skullet-content><p>one line</p></div>
    </div>

    <div id="b" class="skullet" phx-hook="Skullet" data-skullet-state="loading">
      <span class="skullet-status">Loading</span>
      <div data-skullet-overlay aria-hidden="true"></div>
      <div class="skullet-content" data-skullet-content><p>one line</p></div>
    </div>

    <div id="wide" class="skullet" phx-hook="Skullet" data-skullet-state="loading">
      <span class="skullet-status">Loading</span>
      <div data-skullet-overlay aria-hidden="true"></div>
      <div class="skullet-content" data-skullet-content><p>one line</p></div>
    </div>

    <div
      id="fast"
      class="skullet"
      phx-hook="Skullet"
      data-skullet-state="loading"
      style="--skullet-speed: fast"
    >
      <span class="skullet-status">Loading</span>
      <div data-skullet-overlay aria-hidden="true"></div>
      <div class="skullet-content" data-skullet-content><p>one line</p></div>
    </div>

    <div
      id="pulse"
      class="skullet"
      phx-hook="Skullet"
      data-skullet-state="loading"
      style="--skullet-animation: pulse"
    >
      <span class="skullet-status">Loading</span>
      <div data-skullet-overlay aria-hidden="true"></div>
      <div class="skullet-content" data-skullet-content><p>one line</p></div>
    </div>

    <div
      id="none"
      class="skullet"
      phx-hook="Skullet"
      data-skullet-state="loading"
      style="--skullet-animation: none"
    >
      <span class="skullet-status">Loading</span>
      <div data-skullet-overlay aria-hidden="true"></div>
      <div class="skullet-content" data-skullet-content><p>one line</p></div>
    </div>

    <script type="module">
      import { attach } from "/skullet.js"

      window.mount = id => attach(document.getElementById(id))
    </script>
  </body>
</html>
