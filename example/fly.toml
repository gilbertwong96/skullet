# Deploy from the repository root, because the demo depends on the library beside it:
#
#   fly launch --copy-config --no-deploy --ha=false -c example/fly.toml
#   fly secrets set SECRET_KEY_BASE="$(mix phx.gen.secret)" -c example/fly.toml
#   fly deploy --ha=false -c example/fly.toml
#
# One shared-1x machine with 256MB, suspended when idle and resumed on the next request.
app = "skullet-demo"
primary_region = "syd"

[build]
  dockerfile = "example/Dockerfile"

[env]
  PHX_HOST = "skullet-demo.fly.dev"
  PORT = "4000"

[http_service]
  internal_port = 4000
  force_https = true
  # suspend freezes the VM with its memory and resumes it on the next request;
  # `stop` would boot the release again from scratch.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
